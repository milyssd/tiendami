# Cloudflare Tunnel -> Nginx loopback -> Next.js loopback.
# Instalar dentro del contexto http de Nginx; no publicar 3000 ni 8080 al exterior.
server {
 listen 127.0.0.1:8080;
 server_name tienda.example.com;
 client_max_body_size 9m;
 # Solo el proceso cloudflared local puede llegar a este socket TCP.
 # No reutilizar esta confianza si Nginx escucha en una interfaz pública.
 set_real_ip_from 127.0.0.1;
 set_real_ip_from ::1;
 real_ip_header CF-Connecting-IP;
 location / {
  proxy_pass http://127.0.0.1:3000;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header CF-Connecting-IP "";
  proxy_read_timeout 90s;
  proxy_buffering off;
 }
}
